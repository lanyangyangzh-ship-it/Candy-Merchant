<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#07110e">
  <meta name="color-scheme" content="dark">
  <title>宝石商人 · Gem Merchant</title>
  <style>
/* ============================================================
   宝石商人 · Gem Merchant
   ============================================================ */
:root {
  --bg: #07110e;
  --bg-2: #0a1512;
  --ink: #f3eddf;
  --ink-dim: #cfc8b8;
  --muted: #909d95;
  --muted-2: #66746c;
  --gold: #d9b15f;
  --gold-2: #f4e2a9;
  --gold-3: #9c7433;
  --gold-soft: rgba(217, 177, 95, 0.14);
  --line: rgba(219, 190, 128, 0.16);
  --line-soft: rgba(255, 255, 255, 0.07);
  --panel: rgba(255, 255, 255, 0.035);
  --panel-2: rgba(0, 0, 0, 0.22);
  --ruby: #d84a5c;
  --serif: Georgia, "Times New Roman", "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", STSong, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled { cursor: default; }
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
button:active { transform: translateY(0.5px); }
svg { display: block; }

/* ---------- 背景 ---------- */
.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 45% at 12% -4%, rgba(25, 118, 87, 0.32), transparent 62%),
    radial-gradient(50% 38% at 102% 8%, rgba(155, 42, 64, 0.2), transparent 62%),
    radial-gradient(72% 48% at 50% 108%, rgba(184, 143, 65, 0.1), transparent 68%),
    linear-gradient(180deg, #08130f 0%, #06100d 52%, #050b09 100%);
}
.ambient::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.5;
  background-image: repeating-linear-gradient(118deg, rgba(255, 255, 255, 0.014) 0 1px, transparent 1px 9px);
}
.ambient::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
}

.screen {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

/* ---------- 通用 ---------- */
.gem { width: 100%; height: 100%; overflow: visible; }
.muted { color: var(--muted); }
.gold { color: var(--gold-2); }
.serif { font-family: var(--serif); }
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 48px;
  padding: 0 20px;
  border-radius: 13px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  transition: transform 0.15s var(--ease), filter 0.15s, background 0.2s, border-color 0.2s;
  touch-action: manipulation;
}
.btn:active { transform: scale(0.975); }
.btn.primary {
  color: #1d1507;
  background: linear-gradient(145deg, #f6e3ab 0%, #d9b15f 45%, #bd8f3d 100%);
  box-shadow: 0 6px 20px rgba(196, 150, 67, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.55);
}
.btn.primary:disabled {
  color: rgba(29, 21, 7, 0.45);
  background: linear-gradient(145deg, #6e6248, #55492f);
  box-shadow: none;
}
.btn.ghost {
  color: var(--ink-dim);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
}
.btn.ghost:disabled { opacity: 0.38; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 12px; border-radius: 10px; }
.btn .sub { font-size: 10px; font-weight: 400; opacity: 0.7; letter-spacing: 0.02em; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  color: var(--muted);
  border: 1px solid transparent;
  transition: color 0.2s, background 0.2s, border-color 0.2s;
}
.icon-btn:active { background: rgba(255, 255, 255, 0.06); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn.on { color: var(--gold-2); border-color: var(--line); background: var(--gold-soft); }

.panel {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.16));
}

/* ============================================================
   标题页
   ============================================================ */
.title-screen {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  padding: 4px 4px 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.title-tools {
  position: absolute;
  top: 2px;
  right: 0;
  display: flex;
  gap: 2px;
  z-index: 4;
}
.title-hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: clamp(28px, 8vh, 76px);
}
.kicker {
  font-size: 9px;
  letter-spacing: 0.38em;
  color: var(--gold-3);
  text-transform: uppercase;
  margin-bottom: 18px;
  white-space: nowrap;
}
.hero-gem {
  position: relative;
  width: clamp(118px, 34vw, 154px);
  height: clamp(118px, 34vw, 154px);
  display: grid;
  place-items: center;
  margin-bottom: 6px;
  animation: floatGem 7s ease-in-out infinite;
}
.hero-gem::before {
  content: "";
  position: absolute;
  inset: -26%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(77, 201, 161, 0.22) 0%, rgba(77, 201, 161, 0) 68%);
  filter: blur(2px);
}
.hero-gem .gem.main { width: 100%; height: 100%; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 24px rgba(85, 190, 255, 0.18)); }
.hero-gem .gem.mini {
  position: absolute;
  width: 34%;
  height: 34%;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.5));
}
.hero-gem .gem.mini.one { right: -4%; bottom: 6%; transform: rotate(9deg); }
.hero-gem .gem.mini.two { left: -2%; top: 9%; width: 27%; height: 27%; transform: rotate(-13deg); }
.hero-gem .spark {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold-2);
  box-shadow: 0 0 12px var(--gold);
  animation: twinkle 3.4s ease-in-out infinite;
}
.hero-gem .spark.s1 { top: 2%; right: 8%; }
.hero-gem .spark.s2 { top: 52%; left: -10%; animation-delay: 1.1s; width: 3px; height: 3px; }
.hero-gem .spark.s3 { bottom: 7%; right: 13%; animation-delay: 2s; width: 4px; height: 4px; }

h1.title {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(48px, 15vw, 72px);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: 0.14em;
  padding-left: 0.14em;
  background: linear-gradient(178deg, #fff9e9 0%, #f0d995 38%, #d9b15f 62%, #9b6d2b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 24px rgba(185, 138, 55, 0.16));
}
.title-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  color: var(--gold-3);
}
.title-rule i { display: block; width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-3)); }
.title-rule i:last-child { background: linear-gradient(90deg, var(--gold-3), transparent); }
.title-rule span { font-size: 8.5px; letter-spacing: 0.34em; }
.title-sub {
  margin: 14px 0 0;
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--ink-dim);
}
.title-actions {
  width: min(100%, 320px);
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin: 26px 0 20px;
}
.title-actions .btn { width: 100%; min-height: 50px; }
.title-actions .btn.ghost { min-height: 44px; }
.title-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding-bottom: 6px;
  color: var(--muted-2);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  line-height: 1.7;
}
.title-foot p { margin: 0; }
.title-foot .hint { color: var(--muted-2); opacity: 0.8; }
.record {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.18);
  color: var(--muted);
  font-size: 9.5px;
}
.record b { color: var(--gold-2); font-weight: 600; }
.save-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 9px;
  color: var(--muted);
  margin-top: 4px;
  letter-spacing: 0.02em;
}
.save-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.float-gems { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float-gems .gem { position: absolute; opacity: 0.2; filter: blur(0.3px); }
.float-gems .g1 { width: 34px; height: 34px; left: 6%; top: 28%; animation: drift 12s ease-in-out infinite; }
.float-gems .g2 { width: 22px; height: 22px; right: 7%; top: 41%; animation: drift 15s ease-in-out infinite reverse; }
.float-gems .g3 { width: 18px; height: 18px; left: 12%; bottom: 22%; animation: drift 11s ease-in-out infinite 1s; }

/* ============================================================
   对局界面
   ============================================================ */
.game-screen { gap: 5px; }
.hud {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  flex: none;
}
.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0.1em;
  color: var(--gold-2);
  white-space: nowrap;
}
.brand .brand-gem { width: 17px; height: 17px; flex: none; }
.turnchip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.2);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  color: var(--muted);
  white-space: nowrap;
}
.turnchip i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.turnchip.you { color: var(--gold-2); border-color: rgba(217, 177, 95, 0.32); }
.turnchip.you i { background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: breathe 2.2s ease-in-out infinite; }
.turnchip.ai i { background: var(--ruby); animation: breathe 1.2s ease-in-out infinite; }
.turnchip.final { color: #ffb9bd; border-color: rgba(216, 74, 92, 0.35); }
.turnchip.final i { background: var(--ruby); }
.hud-actions { display: flex; gap: 0; flex: none; }
.hud-actions .icon-btn { width: 29px; height: 29px; }
.hud-actions .icon-btn svg { width: 16px; height: 16px; }

.status {
  flex: none;
  height: 16px;
  line-height: 16px;
  padding: 0 2px;
  font-size: 9.5px;
  letter-spacing: 0.03em;
  color: var(--muted-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.status b { color: var(--ink-dim); font-weight: 500; }
.status .dots { display: inline-flex; gap: 2px; margin-left: 3px; vertical-align: 1px; }
.status .dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: dot 1.2s infinite; }
.status .dots i:nth-child(2) { animation-delay: 0.15s; }
.status .dots i:nth-child(3) { animation-delay: 0.3s; }

/* ---------- 玩家条 ---------- */
.strip {
  flex: none;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 58px;
  padding: 6px 9px;
  border: 1px solid var(--line-soft);
  border-radius: 13px;
  background:
    radial-gradient(100% 120% at 0% 0%, rgba(255, 255, 255, 0.045), transparent 60%),
    rgba(0, 0, 0, 0.18);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.strip.active {
  border-color: rgba(217, 177, 95, 0.4);
  box-shadow: 0 0 0 1px rgba(217, 177, 95, 0.08), 0 0 22px rgba(217, 177, 95, 0.06) inset;
}
.strip.rival.active {
  border-color: rgba(216, 74, 92, 0.36);
  box-shadow: 0 0 0 1px rgba(216, 74, 92, 0.08), 0 0 22px rgba(216, 74, 92, 0.05) inset;
}
.strip .avatar {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  padding: 6px;
  border: 1px solid rgba(217, 177, 95, 0.28);
  background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.32));
  box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.4);
}
.strip.rival .avatar { border-color: rgba(216, 74, 92, 0.28); }
.p-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.p-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.p-name { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.p-role { font-size: 8.5px; color: var(--muted-2); letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-top .mini-note {
  margin-left: auto;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 8px;
  color: var(--muted);
  padding: 2px 5px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.04);
}
.p-top .mini-note svg { width: 9px; height: 9px; }
.p-assets { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; row-gap: 2px; min-width: 0; }
.asset-group { display: inline-flex; align-items: center; gap: 2px; padding-right: 4px; }
.asset-group + .asset-group { border-left: 1px solid rgba(255, 255, 255, 0.06); padding-left: 5px; }
.asset-group > i {
  font-style: normal;
  font-size: 7.5px;
  color: var(--muted-2);
  letter-spacing: 0.04em;
  margin-right: 1px;
}
.asset {
  position: relative;
  width: 15px;
  height: 15px;
  flex: none;
  opacity: 0.95;
}
.asset .gem { width: 100%; height: 100%; }
.asset b {
  position: absolute;
  right: -3px;
  bottom: -3px;
  min-width: 9px;
  height: 9px;
  padding: 0 2px;
  border-radius: 999px;
  background: #0d1714;
  color: var(--ink);
  font-size: 7px;
  line-height: 9px;
  text-align: center;
  font-weight: 600;
  border: 1px solid rgba(255, 255, 255, 0.09);
}
.asset.zero { opacity: 0.28; }
.p-score {
  flex: none;
  width: 42px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  line-height: 1;
}
.p-score b {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  color: var(--gold-2);
  letter-spacing: -0.02em;
}
.strip.rival .p-score b { color: #f0b9af; }
.p-score span { font-size: 7.5px; color: var(--muted-2); margin-top: 2px; letter-spacing: 0.1em; }
.p-score em {
  font-style: normal;
  display: inline-flex;
  align-items: center;
  gap: 1px;
  margin-top: 3px;
  font-size: 8px;
  color: var(--gold);
}
.p-score em svg { width: 9px; height: 9px; }
.mini-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: auto;
  padding: 3px 6px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: rgba(217, 177, 95, 0.06);
  color: var(--gold-2);
  font-size: 8px;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.mini-btn svg { width: 9px; height: 9px; }
.mini-btn:disabled { opacity: 0.4; }

/* ---------- 贵族 ---------- */
.nobles {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  height: 56px;
}
.noble {
  position: relative;
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  padding: 4px 5px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 100% at 20% 0%, rgba(217, 177, 95, 0.1), transparent 60%),
    rgba(0, 0, 0, 0.2);
  text-align: left;
  overflow: hidden;
}
.noble .crown { flex: none; width: 20px; height: 20px; color: var(--gold); }
.noble .noble-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.noble .noble-name { font-size: 7.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.02em; }
.noble .noble-pts { font-family: var(--serif); font-size: 13px; color: var(--gold-2); line-height: 1; }
.noble .noble-pts small { font-family: var(--sans); font-size: 7px; color: var(--muted-2); margin-left: 2px; }
.noble .reqs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.noble .req { position: relative; width: 12px; height: 12px; opacity: 0.9; }
.noble .req .gem { width: 100%; height: 100%; }
.noble .req b {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 6.5px;
  color: #fff;
  text-shadow: 0 1px 2px #000, 0 0 2px #000;
  font-weight: 700;
}
.noble .req.met { filter: drop-shadow(0 0 4px rgba(244, 226, 169, 0.8)); }
.noble .req.met::after {
  content: "";
  position: absolute;
  inset: -2px;
  border: 1px solid rgba(244, 226, 169, 0.7);
  border-radius: 50%;
}
.noble.gone {
  justify-content: center;
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.06);
  background: rgba(0, 0, 0, 0.1);
  color: var(--muted-2);
  font-size: 8px;
  letter-spacing: 0.08em;
}
.noble:active { transform: scale(0.985); }

/* ---------- 市场 ---------- */
.market {
  flex: 1 1 auto;
  min-height: 208px;
  max-height: 430px;
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 5px;
}
.market-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; min-height: 0; }

.card {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  min-height: 0;
  padding: 0;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.075);
  background:
    radial-gradient(120% 95% at 50% -8%, var(--tint-soft, rgba(255, 255, 255, 0.06)), transparent 62%),
    linear-gradient(165deg, #16221e 0%, #0d1713 58%, #0a120f 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 2px 8px rgba(0, 0, 0, 0.22);
  overflow: hidden;
  text-align: left;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.12s var(--ease);
  touch-action: manipulation;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.36) 100%),
    repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0 1px, transparent 1px 7px);
  pointer-events: none;
}
.card:active { transform: scale(0.972); }
.card.affordable {
  border-color: rgba(231, 196, 120, 0.55);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 0 0 1px rgba(231, 196, 120, 0.08), 0 0 16px rgba(217, 177, 95, 0.08);
}
.card.affordable::after {
  content: "";
  position: absolute;
  top: -1px;
  right: -1px;
  width: 26px;
  height: 26px;
  background: linear-gradient(225deg, rgba(244, 226, 169, 0.9) 0%, rgba(244, 226, 169, 0) 58%);
  border-top-right-radius: 10px;
  opacity: 0.7;
  pointer-events: none;
}
.card .card-level {
  position: absolute;
  top: 4px;
  right: 5px;
  z-index: 2;
  font-family: var(--serif);
  font-size: 7px;
  letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.28);
}
.card.affordable .card-level { color: rgba(29, 21, 7, 0.6); }
.card .card-pts {

}

.pip b {

  letter-spacing: 0.08em;
}
.card.empty .gem { width: 24px; height: 24px; opacity: 0.18; margin: 0 auto 3px; }

/* ---------- 银行 ---------- */
.bank {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 57px;
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(0, 0, 0, 0.2));
}
.bank-label {
  flex: none;
  width: 21px;
  font-size: 8px;
  line-height: 1.25;
  color: var(--muted-2);
  letter-spacing: 0.08em;
  text-align: center;
  writing-mode: vertical-rl;
}
.bank-gems { flex: 1; display: flex; align-items: stretch; gap: clamp(2px, 1vw, 5px); }
.bank-gem {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;

}

.bank-gem .bank-gem-svg { width: clamp(22px, 7.5vw, 28px); height: clamp(22px, 7.5vw, 28px); filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4)); }
.bank-gem .gem-label { font-size: 7px; line-height: 1; color: var(--muted-2); letter-spacing: 0.02em; white-space: nowrap; }
.bank-gem .stock {
  position: absolute;
  right: 3px;
  top: 2px;
  min-width: 13px;
  height: 13px;
  padding: 0 3px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.58);
  border: 1px solid rgba(255, 255, 255, 0.1);

  font-size: 8px;
  line-height: 11px;
  text-align: center;
  font-weight: 600;
}
.bank-gem .picked {
  position: absolute;
  left: 2px;
  top: -3px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;

  background: linear-gradient(145deg, #f6e3ab, #d9b15f);
  color: #231906;
  font-size: 8.5px;
  line-height: 14px;
  text-align: center;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}
.bank-gem.selected {
  background: rgba(217, 177, 95, 0.1);
  border-color: rgba(217, 177, 95, 0.5);
  box-shadow: 0 0 0 1px rgba(217, 177, 95, 0.1), 0 0 14px rgba(217, 177, 95, 0.1) inset;
}
.bank-gem.dim { opacity: 0.34; }
.bank-gem:disabled { opacity: 0.42; }
.bank-gem.gold-hint .gem-label { color: var(--gold-3); }

/* ---------- 自己 ---------- */
.self-strip { min-height: 64px; }
.self-strip .avatar { border-color: rgba(217, 177, 95, 0.4); }
.self-strip .p-score b { color: var(--gold-2); }

/* ---------- 拿取托盘 ---------- */
.tray {
  position: fixed;
  z-index: 45;
  left: 10px;
  right: 10px;
  bottom: calc(max(8px, env(safe-area-inset-bottom)) + 2px);
  max-width: 540px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border-radius: 15px;
  border: 1px solid rgba(217, 177, 95, 0.38);
  background: linear-gradient(180deg, rgba(23, 37, 31, 0.98), rgba(9, 17, 14, 0.99));
  box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.4);
  transform: translateY(calc(100% + 24px));
  opacity: 0;
  pointer-events: none;
  transition: transform 0.28s var(--ease), opacity 0.2s;
}
.tray.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
.tray .tray-gems { display: flex; align-items: center; gap: 4px; flex: none; }
.tray .tray-gem { position: relative; width: 25px; height: 25px; }
.tray .tray-gem .gem { width: 100%; height: 100%; }
.tray .tray-gem b {
  position: absolute;
  right: -4px;
  bottom: -3px;
  min-width: 12px;
  height: 12px;
  padding: 0 3px;
  border-radius: 999px;
  background: var(--gold);
  color: #201604;
  font-size: 8px;
  line-height: 12px;
  text-align: center;
  font-weight: 700;
}
.tray .tray-copy { flex: 1; min-width: 0; }
.tray .tray-copy b { display: block; font-size: 10.5px; color: var(--ink-dim); font-weight: 500; letter-spacing: 0.02em; }
.tray .tray-copy small { display: block; margin-top: 1px; font-size: 8px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tray .tray-actions { display: flex; gap: 5px; flex: none; }
.tray .btn { min-height: 36px; padding: 0 11px; font-size: 11px; border-radius: 9px; }

/* ============================================================
   弹窗
   ============================================================ */
.modal-root { position: relative; z-index: 70; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  background: rgba(3, 7, 6, 0.72);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  animation: fadeIn 0.18s ease-out;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.sheet {
  position: relative;
  width: min(100%, 370px);
  max-height: min(86dvh, 760px);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 18px 16px 16px;
  border-radius: 19px;
  border: 1px solid rgba(217, 177, 95, 0.24);
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(217, 177, 95, 0.09), transparent 52%),
    linear-gradient(180deg, #15231e 0%, #0a1411 100%);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  animation: sheetIn 0.26s var(--ease);
}
.sheet.wide { width: min(100%, 410px); }
.sheet-close {
  position: absolute;
  top: 9px;
  right: 9px;
  z-index: 2;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.sheet-close svg { width: 14px; height: 14px; }
.sheet-kicker {
  font-size: 8px;
  letter-spacing: 0.26em;
  color: var(--gold-3);
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-right: 30px;
}
.sheet h2, .sheet h3 { margin: 0; font-family: var(--serif); font-weight: 600; letter-spacing: 0.06em; }
.sheet h2 { font-size: 24px; }
.sheet h3 { font-size: 18px; }
.sheet .lead { margin: 6px 0 0; font-size: 10.5px; line-height: 1.65; color: var(--muted); }
.sheet-actions { display: flex; gap: 7px; margin-top: 14px; }
.sheet-actions .btn { flex: 1; min-height: 44px; font-size: 12px; }

/* 卡牌详情 */
.card-detail { display: flex; gap: 13px; align-items: stretch; margin-top: 3px; }
.big-card-wrap { flex: none; width: 118px; }
.card.big { width: 118px; height: 166px; border-radius: 12px; cursor: default; }
.card.big:active { transform: none; }
.card.big .card-pts { font-size: 22px; top: 7px; left: 8px; }
.card.big .card-pts.zero { font-size: 15px; }
.card.big .card-level { font-size: 9px; top: 7px; right: 8px; }
.card.big .card-gem { width: 48%; height: 48%; top: 45%; }
.card.big .card-cost { left: 7px; right: 7px; bottom: 8px; gap: 2px; }
.card.big .pip { width: 19px; height: 19px; }
.card.big .pip b { font-size: 9.5px; }
.card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.card-info h3 { font-size: 17px; line-height: 1.25; }
.card-info .card-sub { margin-top: 4px; font-size: 9px; color: var(--muted); line-height: 1.5; }
.card-info .prestige {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-top: 8px;
  color: var(--gold-2);
  font-family: var(--serif);
}
.card-info .prestige b { font-size: 20px; font-weight: 600; }
.card-info .prestige small { font-size: 8px; color: var(--muted); font-family: var(--sans); letter-spacing: 0.08em; }
.cost-box { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }
.cost-row {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  color: var(--muted);
  padding: 3px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.045);
}
.cost-row:last-child { border-bottom: 0; }
.cost-row .mini-gem { width: 15px; height: 15px; flex: none; }
.cost-row .cost-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cost-row .cost-val { color: var(--ink-dim); font-weight: 600; font-size: 10px; }
.cost-row .cost-state { font-size: 8px; color: var(--muted-2); }
.cost-row .cost-state.ok { color: #6fd6ad; }
.cost-row .cost-state.gold { color: var(--gold); }
.cost-row .cost-state.miss { color: #e58b8b; }
.card-note {
  margin-top: 11px;
  padding: 7px 8px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  font-size: 8.5px;
  line-height: 1.55;
  color: var(--muted);
}
.card-note b { color: var(--gold-2); font-weight: 500; }

/* 预订列表 */
.reserved-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.reserved-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px;
  border-radius: 11px;
  border: 1px solid var(--line-soft);
  background: rgba(0, 0, 0, 0.16);
}
.reserved-item .card { width: 51px; height: 70px; border-radius: 7px; cursor: pointer; }
.reserved-item .card .card-pts { font-size: 12px; top: 3px; left: 4px; }
.reserved-item .card .card-level { font-size: 6px; top: 3px; right: 4px; }
.reserved-item .card .card-gem { width: 48%; height: 48%; top: 46%; }
.reserved-item .card .card-cost { left: 3px; right: 3px; bottom: 3px; gap: 1px; }
.reserved-item .card .pip { width: 11px; height: 11px; }
.reserved-item .card .pip b { font-size: 5.5px; }
.reserved-item .res-info { flex: 1; min-width: 0; }
.reserved-item .res-name { font-size: 11px; font-weight: 500; }
.reserved-item .res-meta { margin-top: 2px; font-size: 8px; color: var(--muted-2); }
.reserved-item .btn { flex: none; min-height: 34px; padding: 0 9px; font-size: 10px; border-radius: 8px; }
.blind-box {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.blind-box h4 { margin: 0 0 3px; font-size: 11px; font-weight: 600; color: var(--ink-dim); }
.blind-box p { margin: 0 0 8px; font-size: 8.5px; line-height: 1.55; color: var(--muted-2); }
.blind-levels { display: flex; gap: 6px; }
.blind-levels .btn { flex: 1; min-height: 36px; font-size: 10px; padding: 0 5px; }
.empty-state { padding: 26px 0 20px; text-align: center; color: var(--muted-2); font-size: 10px; line-height: 1.7; }
.empty-state .gem { width: 38px; height: 38px; margin: 0 auto 9px; opacity: 0.35; }

/* 贵族详情 / 选择 */
.noble-hero { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.noble-hero .crown-big { width: 45px; height: 45px; color: var(--gold); flex: none; }
.noble-hero .noble-title { font-family: var(--serif); font-size: 20px; }
.noble-hero .noble-title small { display: block; margin-top: 2px; font-family: var(--sans); font-size: 8.5px; color: var(--muted); letter-spacing: 0.12em; }
.req-table { display: flex; flex-direction: column; gap: 4px; }
.req-line { display: flex; align-items: center; gap: 7px; font-size: 9.5px; color: var(--muted); padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
.req-line .mini-gem { width: 17px; height: 17px; flex: none; }
.req-line .req-name { flex: 1; }
.req-line .req-count { color: var(--ink-dim); font-weight: 600; }
.req-line .req-status { font-size: 8px; color: var(--muted-2); min-width: 54px; text-align: right; }
.req-line .req-status.ok { color: #6fd6ad; }
.noble-choice-list { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
.noble-choice {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(217, 177, 95, 0.07), rgba(0, 0, 0, 0.15));
  text-align: left;
}
.noble-choice .crown { width: 26px; height: 26px; color: var(--gold); flex: none; }
.noble-choice .nc-main { flex: 1; min-width: 0; }
.noble-choice .nc-name { font-size: 12px; font-weight: 500; }
.noble-choice .nc-reqs { display: flex; gap: 3px; margin-top: 3px; }
.noble-choice .nc-reqs .mini-gem { width: 15px; height: 15px; }
.noble-choice .nc-reqs span { position: relative; }
.noble-choice .nc-reqs b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 7px; color: #fff; text-shadow: 0 1px 2px #000; }
.noble-choice .btn { min-height: 34px; padding: 0 10px; font-size: 10px; }

/* 弃牌 */
.discard-head { text-align: center; }
.discard-head .gem { width: 50px; height: 50px; margin: 0 auto 10px; opacity: 0.8; }
.discard-head h2 { font-size: 22px; }
.discard-head p { margin: 6px 0 0; font-size: 10px; color: var(--muted); line-height: 1.6; }
.discard-count { color: var(--gold-2); font-family: var(--serif); font-size: 18px; }
.discard-gems { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
.discard-gem {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 10px;
  border: 1px solid var(--line-soft);
  background: rgba(0, 0, 0, 0.16);
}
.discard-gem .dg-svg { width: 31px; height: 31px; }
.discard-gem .dg-name { font-size: 8px; color: var(--muted); }
.discard-gem .dg-count { font-size: 11px; font-weight: 600; color: var(--ink-dim); }
.discard-gem:disabled { opacity: 0.25; }
.discard-gem:active { transform: scale(0.96); }
.discard-progress { margin-top: 12px; text-align: center; font-size: 9px; color: var(--muted); }
.discard-progress b { color: var(--gold-2); font-size: 12px; }

/* 规则 */
.rules-body { max-height: calc(86dvh - 120px); overflow-y: auto; padding-right: 2px; }
.rules-body h3 { font-size: 13px; font-family: var(--sans); letter-spacing: 0.06em; color: var(--gold-2); margin: 16px 0 6px; display: flex; align-items: center; gap: 6px; }
.rules-body h3:first-child { margin-top: 2px; }
.rules-body h3 .gem { width: 15px; height: 15px; }
.rules-body p, .rules-body li { font-size: 10px; line-height: 1.75; color: var(--muted); }
.rules-body p { margin: 0 0 6px; }
.rules-body ul { margin: 0; padding-left: 16px; }
.rules-body li { margin: 2px 0; }
.rules-body b { color: var(--ink-dim); font-weight: 500; }
.rules-body .rule-card {
  display: flex;
  gap: 8px;
  padding: 7px 8px;
  margin: 4px 0;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(255, 255, 255, 0.045);
}
.rules-body .rule-card .rule-no {
  flex: none;
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--gold);
  font-size: 8px;
  font-family: var(--serif);
}
.rules-body .rule-card .rule-text { font-size: 9.5px; line-height: 1.65; color: var(--muted); }
.rules-body .rule-card .rule-text b { color: var(--ink-dim); }
.rules-body .credit { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 8px; color: var(--muted-2); line-height: 1.7; }

/* 菜单 */
.menu-list { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.menu-list .btn { width: 100%; min-height: 46px; justify-content: flex-start; padding: 0 14px; font-size: 12px; }
.menu-list .btn .menu-ico { width: 17px; height: 17px; color: var(--gold); flex: none; }
.menu-list .btn.danger { color: #e59a9a; }
.menu-list .btn.danger .menu-ico { color: #d87575; }
.menu-foot { margin-top: 13px; text-align: center; font-size: 8px; color: var(--muted-2); letter-spacing: 0.06em; }

/* 确认 */
.confirm-copy { margin: 8px 0 0; font-size: 10.5px; line-height: 1.7; color: var(--muted); text-align: center; }

/* 终局 */
.modal-backdrop.gameover { background: rgba(2, 5, 4, 0.82); }
.over-panel {
  position: relative;
  width: min(100%, 360px);
  text-align: center;
  padding: 26px 18px 18px;
  border-radius: 22px;
  border: 1px solid rgba(217, 177, 95, 0.28);
  background:
    radial-gradient(90% 55% at 50% 0%, rgba(217, 177, 95, 0.16), transparent 64%),
    linear-gradient(180deg, #17251f 0%, #09120f 100%);
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
  animation: sheetIn 0.35s var(--ease);
  overflow: hidden;
}
.over-panel.lose { border-color: rgba(216, 74, 92, 0.2); }
.over-panel.lose::before { background: radial-gradient(circle, rgba(216, 74, 92, 0.18), transparent 65%); }
.over-panel::before {
  content: "";
  position: absolute;
  top: -90px;
  left: 50%;
  width: 250px;
  height: 190px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217, 177, 95, 0.26), transparent 65%);
  filter: blur(10px);
  pointer-events: none;
}
.over-crown { position: relative; width: 62px; height: 62px; margin: 0 auto 8px; color: var(--gold); filter: drop-shadow(0 6px 14px rgba(217, 177, 95, 0.25)); }
.over-crown .crown { width: 100%; height: 100%; }
.over-panel .over-kicker { font-size: 8px; letter-spacing: 0.3em; color: var(--gold-3); text-transform: uppercase; }
.over-panel h2 { margin: 7px 0 0; font-family: var(--serif); font-size: 31px; letter-spacing: 0.1em; background: linear-gradient(180deg, #fff7df, #e2c47b 70%, #a87b33); -webkit-background-clip: text; background-clip: text; color: transparent; }
.over-panel.lose h2 { background: linear-gradient(180deg, #f3d9d6, #c98e8b 70%, #7e4a48); -webkit-background-clip: text; background-clip: text; }
.over-verdict { margin-top: 4px; font-size: 9.5px; letter-spacing: 0.14em; color: var(--muted); }
.over-scores { display: flex; align-items: stretch; justify-content: center; gap: 8px; margin: 18px 0 4px; }
.over-score {
  flex: 1;
  max-width: 135px;
  padding: 10px 8px;
  border-radius: 12px;
  border: 1px solid var(--line-soft);
  background: rgba(0, 0, 0, 0.2);
}
.over-score.winner { border-color: rgba(217, 177, 95, 0.4); background: linear-gradient(180deg, rgba(217, 177, 95, 0.1), rgba(0, 0, 0, 0.16)); }
.over-score .os-name { font-size: 9px; color: var(--muted); letter-spacing: 0.06em; }
.over-score .os-points { margin: 2px 0 3px; font-family: var(--serif); font-size: 34px; line-height: 1; color: var(--gold-2); }
.over-score.loser .os-points { color: var(--ink-dim); }
.over-score .os-meta { font-size: 7.5px; color: var(--muted-2); line-height: 1.5; }
.over-note { margin: 12px 0 0; font-size: 8.5px; line-height: 1.6; color: var(--muted-2); }
.over-actions { display: flex; gap: 7px; margin-top: 16px; }
.over-actions .btn { flex: 1; min-height: 44px; font-size: 12px; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -10px; width: 5px; height: 8px; border-radius: 1px; opacity: 0; animation: fall 3.4s linear infinite; }

/* ---------- Toast ---------- */
.toasts {
  position: fixed;
  z-index: 90;
  top: calc(max(8px, env(safe-area-inset-top)) + 20px);
  left: 50%;
  transform: translateX(-50%);
  width: min(92%, 360px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}
.toast {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid rgba(217, 177, 95, 0.26);
  background: rgba(13, 24, 19, 0.94);
  color: var(--ink-dim);
  font-size: 10px;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
  animation: toastIn 0.28s var(--ease);
  backdrop-filter: blur(8px);
}
.toast .gem { width: 13px; height: 13px; flex: none; }
.toast.error { border-color: rgba(216, 74, 92, 0.36); color: #f1c3c3; }
.toast.gold { border-color: rgba(217, 177, 95, 0.5); color: var(--gold-2); }
.toast.out { animation: toastOut 0.3s ease forwards; }

/* ---------- 动画 ---------- */
@keyframes floatGem {
  0%, 100% { transform: translateY(0) rotate(-1.5deg); }
  50% { transform: translateY(-9px) rotate(1.5deg); }
}
@keyframes drift {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(9px, -16px) rotate(10deg); }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(0.7); }
  50% { opacity: 0.95; transform: scale(1.15); }
}
@keyframes breathe {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}
@keyframes dot {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-1px); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn {
  from { opacity: 0; transform: translateY(18px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-6px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateY(-8px); }
}
@keyframes fall {
  0% { opacity: 0; transform: translateY(0) rotate(0deg); }
  8% { opacity: 0.85; }
  100% { opacity: 0; transform: translateY(520px) rotate(520deg); }
}

/* ============================================================
   卡牌美术 v2 · 90 张独立场景
   ============================================================ */
.card {
  background: #08110e;
  border-color: rgba(217, 177, 95, 0.18);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.03);
}
.card::before { display: none; }
.card::after { display: none; }
.card-art-wrap {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  border-radius: inherit;
}
.card-art-wrap > svg,
.card-art {
  width: 100%;
  height: 100%;
  display: block;
}
.card-gem-fallback {
  position: absolute;
  left: 50%;
  top: 44%;
  width: 48%;
  height: 48%;
  transform: translate(-50%, -50%);
}
.card-shade {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(2, 7, 5, 0.56) 0%, rgba(2, 7, 5, 0.1) 24%, rgba(2, 7, 5, 0) 48%, rgba(2, 7, 5, 0.24) 72%, rgba(2, 7, 5, 0.72) 100%),
    radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.24) 100%);
}
.card-frame {
  position: absolute;
  inset: 3px;
  z-index: 3;
  border-radius: 7px;
  border: 1px solid rgba(244, 226, 169, 0.2);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
  pointer-events: none;
}
.card[data-level="1"] .card-frame { border-color: rgba(190, 143, 78, 0.34); }
.card[data-level="2"] .card-frame { border-color: rgba(206, 214, 220, 0.3); }
.card[data-level="3"] .card-frame { border-color: rgba(244, 214, 140, 0.46); }

.card .card-pts {
  position: absolute;
  top: 3px;
  left: 3px;
  z-index: 6;
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  background: linear-gradient(145deg, #f8e8b6 0%, #d9b15f 55%, #a77c32 100%);
  color: #221806;
  font-family: var(--serif);
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
  filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
}
.card .card-pts.zero {
  background: rgba(3, 10, 7, 0.62);
  color: rgba(255, 255, 255, 0.48);
  box-shadow: inset 0 0 0 1px rgba(244, 226, 169, 0.32);
  filter: none;
}
.card .card-pts.high {
  filter: drop-shadow(0 0 6px rgba(244, 226, 169, 0.55)) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
}
.card .card-level {
  top: 4px;
  right: 5px;
  z-index: 6;
  font-size: 7px;
  color: rgba(244, 226, 169, 0.68);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
}
.card[data-level="3"] .card-level { color: var(--gold-2); }
.card .card-cost {
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  padding: 4px 4px 4px;
  gap: 1.5px;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.38) 30%, rgba(0, 0, 0, 0.78) 100%);
  box-shadow: inset 0 1px 0 rgba(244, 226, 169, 0.14);
}
.card .card-cost .pip {
  width: clamp(13px, 4.2vw, 16px);
  height: clamp(13px, 4.2vw, 16px);
}
.card .card-cost .pip b { font-size: clamp(6.5px, 1.9vw, 8px); }
.card.affordable {
  border-color: rgba(244, 226, 169, 0.66);
  box-shadow: 0 0 0 1px rgba(244, 226, 169, 0.1), 0 0 18px rgba(217, 177, 95, 0.13);
}
.card.affordable .card-frame { border-color: rgba(244, 226, 169, 0.38); }
.card.affordable .card-frame::after {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  top: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
}
.card.big {
  width: 118px;

}

.card.big .card-pts { width: 25px; height: 25px; font-size: 14px; top: 6px; left: 6px; }

  flex: none;
  margin-left: auto;
  font-family: var(--serif);
  font-size: 12px;
  line-height: 1;
  color: var(--gold-2);
  white-space: nowrap;
}
.rival-points small { font-family: var(--sans); font-size: 4.5px; color: var(--muted-2); margin-left: 1px; }
.rival-bonuses { display: flex; align-items: center; gap: 1px; }
.asset.tiny { width: 11px; height: 11px; }
.asset.tiny b {
  min-width: 6px;
  height: 6px;
  padding: 0 1px;
  right: -2px;
  bottom: -2px;
  font-size: 4.5px;
  line-height: 6px;
  border-width: 0.5px;
}
.rival-meta {
  display: flex;
  gap: 4px;
  color: var(--muted-2);
  font-size: 4.5px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
}
.rival-meta span { flex: none; }

/* 5 位贵族 */
.nobles { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.noble { padding: 3px 4px; gap: 3px; }
.noble .noble-portrait { width: 18px; height: 23px; }
.noble .noble-pts { font-size: 11px; }
.noble .req { width: 10px; height: 10px; }
.noble .req b { font-size: 5px; }
.noble .reqs { gap: 1px; }

/* 4 人结算 */
.over-panel { max-height: calc(100vh - 22px); overflow-y: auto; }
.over-scores.four {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
  max-width: 330px;
  margin: 12px auto 4px;
}
.over-scores.four .over-score { padding: 7px 9px; }
.over-scores.four .os-points { font-size: 25px; }
.over-scores.four + .over-note { margin-top: 4px; }

/* 贵族详情：4 名玩家的进度 */
.req-players {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 3px;
  margin-left: auto;
}
.req-player {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  min-width: 24px;
  padding: 1px 2px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.16);
}
.req-player.me { border-color: rgba(217, 177, 95, 0.3); }
.req-player.met b { color: var(--gold-2); }
.req-player i { font-style: normal; font-size: 5px; color: var(--muted-2); }
.req-player b { font-family: var(--sans); font-size: 6px; color: var(--ink); }

@media (max-height: 620px) {
  .rival-card { min-height: 48px; padding: 3px 4px; }
  .rival-avatar { width: 19px; height: 19px; }
  .rival-meta { font-size: 4px; gap: 2px; }
  .rival-top b { font-size: 6px; }
  .nobles { height: 46px; }
  .noble .noble-portrait { width: 17px; height: 21px; }
  .noble .req { width: 9px; height: 9px; }
}

/* 联机大厅座位 */
.seat-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin: 10px 0 12px;
}
.seat {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.03);
}
.seat b { font-size: 10px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat span { margin-left: auto; font-size: 7px; color: var(--muted-2); white-space: nowrap; }
.seat.filled { border-color: rgba(217, 177, 95, 0.3); background: rgba(217, 177, 95, 0.06); }
.seat.empty { opacity: 0.62; border-style: dashed; }

  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="gem-defs" aria-hidden="true"></div>
  <main id="screen" class="screen" aria-live="polite"></main>
  <div id="tray" class="tray" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>这个小游戏需要启用 JavaScript 才能运行。</noscript>
  <script>
/*
 * 宝石商人 · 核心规则引擎
 * ------------------------------------------------------------
 * 规则遵循 Marc André 的桌游《璀璨宝石》(Splendor) 基础版。
 * 这个文件不依赖 DOM，可以直接在 Node 里跑自对弈测试。
 */
(function (global) {
  'use strict';

  const VERSION = 2;

  const COLORS = ['white', 'blue', 'green', 'red', 'black'];
  const GOLD = 'gold';
  const ALL_GEMS = COLORS.concat(GOLD);

  const GEM = {
    white: { key: 'white', name: '钻石',   short: '钻', hex: '#e9e4d4', light: '#fffdf2', dark: '#8e8874', ui: '#f1ecdd' },
    blue:  { key: 'blue',  name: '蓝宝石', short: '蓝', hex: '#3d82e8', light: '#a9ceff', dark: '#123b82', ui: '#6ea8ff' },
    green: { key: 'green', name: '祖母绿', short: '翠', hex: '#1da578', light: '#86f0c9', dark: '#07563e', ui: '#4fd4a6' },
    red:   { key: 'red',   name: '红宝石', short: '红', hex: '#d84a5c', light: '#ffa6ae', dark: '#731624', ui: '#ff7c88' },
    black: { key: 'black', name: '黑曜石', short: '墨', hex: '#444b5d', light: '#9aa4bd', dark: '#0d1018', ui: '#99a3ba' },
    gold:  { key: 'gold',  name: '黄金',   short: '金', hex: '#e2b256', light: '#fff2bd', dark: '#7a4d0d', ui: '#f0c96e' },
  };

  // 桌游原版牌堆的旋转顺序（与公开卡表数据保持一致）
  const ROT = ['white', 'black', 'red', 'green', 'blue'];

  // 每一级、每种宝石各有一套费用模板；三套模板数量相加 = 90 张卡
  const CARD_PATTERNS = {
    1: [
      { cost: [0, 1, 0, 2, 2], points: 0 },
      { cost: [0, 1, 2, 0, 0], points: 0 },
      { cost: [0, 1, 1, 1, 1], points: 0 },
      { cost: [0, 0, 0, 0, 3], points: 0 },
      { cost: [0, 0, 0, 2, 2], points: 0 },
      { cost: [0, 1, 1, 2, 1], points: 0 },
      { cost: [3, 1, 0, 0, 1], points: 0 },
      { cost: [0, 0, 0, 4, 0], points: 1 },
    ],
    2: [
      { cost: [0, 2, 2, 3, 0], points: 1 },
      { cost: [2, 0, 3, 0, 3], points: 1 },
      { cost: [0, 2, 4, 1, 0], points: 2 },
      { cost: [0, 0, 5, 0, 0], points: 2 },
      { cost: [0, 3, 5, 0, 0], points: 2 },
      { cost: [6, 0, 0, 0, 0], points: 3 },
    ],
    3: [
      { cost: [0, 3, 5, 3, 3], points: 3 },
      { cost: [0, 7, 0, 0, 0], points: 4 },
      { cost: [3, 6, 3, 0, 0], points: 4 },
      { cost: [3, 7, 0, 0, 0], points: 5 },
    ],
  };

  const NOBLE_PATTERNS = [
    [3, 3, 3, 0, 0],
    [4, 4, 0, 0, 0],
  ];

  const NOBLE_NAMES = [
    '翡翠王公', '蓝钻伯爵', '赤玉夫人', '黑曜主教', '白晶侯爵',
    '金砂亲王', '碧玺女爵', '紫晶大使', '琥珀勋爵', '月石公爵',
  ];

  const LEVEL_NAMES = { 1: '矿脉', 2: '工坊', 3: '商路' };
  const LEVEL_NUMERALS = { 1: 'I', 2: 'II', 3: 'III' };
  const CARD_VARIANTS = {
    1: ['晶簇', '深井', '暗河', '熔脉', '古门', '矿车', '晶洞', '石桥'],
    2: ['切磨台', '透镜', '金库', '熔炉', '案台', '陈列柜'],
    3: ['沙海商队', '远洋宝船', '王庭贡使', '香料之路'],
  };

  // ------------------------------------------------------------
  // 小工具
  // ------------------------------------------------------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(list, rng) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
    }
    return list;
  }

  function zeroGems() {
    return { white: 0, blue: 0, green: 0, red: 0, black: 0, gold: 0 };
  }

  function sum(obj) {
    return Object.keys(obj).reduce((s, k) => s + obj[k], 0);
  }

  function makePlayer(name, isAI) {
    return {
      name,
      isAI: !!isAI,
      tokens: zeroGems(),
      bonuses: { white: 0, blue: 0, green: 0, red: 0, black: 0 },
      cards: [],
      reserved: [],
      nobles: [],
      points: 0,
    };
  }

  function buildCards() {
    const cards = [];
    for (const level of [1, 2, 3]) {
      for (let i = 0; i < ROT.length; i++) {
        const bonus = ROT[i];
        CARD_PATTERNS[level].forEach((pattern, pi) => {
          const cost = { white: 0, blue: 0, green: 0, red: 0, black: 0 };
          ROT.forEach((color, j) => {
            cost[color] = pattern.cost[(j + i) % 5];
          });
          const baseName = GEM[bonus].name + LEVEL_NAMES[level];
          const variantName = CARD_VARIANTS[level][pi];
          cards.push({
            id: 'c' + level + '-' + bonus + '-' + pi,
            level,
            bonus,
            points: pattern.points,
            cost,
            pattern: pi,
            variantName: variantName,
            name: baseName,
            fullName: baseName + ' · ' + variantName,
          });
        });
      }
    }
    return cards;
  }

  function buildNobles() {
    const nobles = [];
    let idx = 0;
    NOBLE_PATTERNS.forEach((pattern, pi) => {
      for (let i = 0; i < ROT.length; i++) {
        const req = { white: 0, blue: 0, green: 0, red: 0, black: 0 };
        ROT.forEach((color, j) => {
          req[color] = pattern[(j + i) % 5];
        });
        nobles.push({
          id: 'n' + pi + '-' + i,
          points: 3,
          req,
          name: NOBLE_NAMES[idx % NOBLE_NAMES.length],
        });
        idx++;
      }
    });
    return nobles;
  }

  // ------------------------------------------------------------
  // 初始化
  // ------------------------------------------------------------
  function createGame(seed, options) {
    const opts = options || {};
    let s = seed;
    if (s === undefined || s === null) {
      s = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
    }
    const rng = mulberry32(s);
    const allCards = buildCards();
    const decks = {};
    for (const level of [1, 2, 3]) {
      decks[level] = shuffle(allCards.filter((c) => c.level === level), rng);
    }
    const market = {};
    for (const level of [1, 2, 3]) {
      market[level] = decks[level].splice(0, 4);
    }
    const nobles = shuffle(buildNobles(), rng).slice(0, 5);

    const defaultSeats = [
      { name: opts.humanName || '你', isAI: false },
      { name: opts.aiName || '罗伦佐', isAI: true },
      { name: opts.aiName2 || '碧翠丝', isAI: true },
      { name: opts.aiName3 || '马可', isAI: true },
    ];
    const seats = Array.isArray(opts.seats) && opts.seats.length === 4
      ? opts.seats.map((seat, i) => ({
        name: (seat && seat.name) || defaultSeats[i].name,
        isAI: !!(seat && seat.isAI),
      }))
      : defaultSeats;

    const firstPlayer = opts.first === 1 ? 1 : 0;
    const state = {
      v: VERSION,
      seed: s,
      createdAt: Date.now(),
      finishedAt: null,
      players: seats.map((seat) => makePlayer(seat.name, seat.isAI)),
      current: firstPlayer,
      firstPlayer,
      phase: 'play',
      pending: null,
      bank: { white: 10, blue: 10, green: 10, red: 10, black: 10, gold: 5 },
      decks,
      market,
      nobles,
      turnCount: 0,
      endTriggered: false,
      finalTurnsLeft: null,
      winner: null,
      log: [],
      lastEvent: null,
      eventSeq: 0,
      meta: { mode: '4p', playerCount: 4, version: VERSION },
    };

    if (opts.bothAI) state.players.forEach((player) => { player.isAI = true; });

    log(state, state.players[firstPlayer].name + '先手。', 'system');
    return state;
  }

  // ------------------------------------------------------------
  // 查询
  // ------------------------------------------------------------
  function totalTokens(player) {
    return sum(player.tokens);
  }

  function totalCards(player) {
    return player.cards.length;
  }

  function locateCard(state, cardId) {
    if (!cardId) return null;
    for (const level of [1, 2, 3]) {
      const row = state.market[level];
      for (let index = 0; index < row.length; index++) {
        if (row[index] && row[index].id === cardId) {
          return { zone: 'market', level, index };
        }
      }
    }
    for (let p = 0; p < state.players.length; p++) {
      const reserved = state.players[p].reserved;
      for (let index = 0; index < reserved.length; index++) {
        if (reserved[index].id === cardId) {
          return { zone: 'reserved', player: p, index };
        }
      }
    }
    return null;
  }

  function cardAt(state, loc) {
    if (!loc) return null;
    if (loc.zone === 'market') return state.market[loc.level][loc.index] || null;
    if (loc.zone === 'reserved') return state.players[loc.player].reserved[loc.index] || null;
    return null;
  }

  /**
   * 计算一张卡对某位玩家的实际花费。
   * detail: 每种颜色 { cost, bonus, need, pay, gold, short }
   */
  function affordability(player, card) {
    const detail = {};
    let goldNeeded = 0;
    let tokenCost = 0;
    for (const color of COLORS) {
      const cost = card.cost[color] || 0;
      const bonus = Math.min(cost, player.bonuses[color] || 0);
      const need = Math.max(0, cost - bonus);
      const pay = Math.min(need, player.tokens[color] || 0);
      const short = need - pay;
      goldNeeded += short;
      tokenCost += pay;
      detail[color] = { cost, bonus, need, pay, gold: short, short };
    }
    return {
      ok: goldNeeded <= player.tokens.gold,
      gold: goldNeeded,
      tokenCost,
      detail,
    };
  }

  function missingByColor(player, card) {
    const by = {};
    let total = 0;
    for (const color of COLORS) {
      const n = Math.max(0, (card.cost[color] || 0) - (player.bonuses[color] || 0) - (player.tokens[color] || 0));
      by[color] = n;
      total += n;
    }
    return { by, total, afterGold: Math.max(0, total - player.tokens.gold) };
  }

  function eligibleNobles(state, player) {
    return state.nobles.filter((noble) => COLORS.every((c) => (player.bonuses[c] || 0) >= noble.req[c]));
  }

  function validateTake(state, colors) {
    if (!Array.isArray(colors) || colors.length === 0) {
      return { ok: false, reason: '请选择宝石' };
    }
    if (colors.some((c) => !COLORS.includes(c))) {
      return { ok: false, reason: '黄金只能通过预订卡牌获得' };
    }
    const uniq = Array.from(new Set(colors));
    const availableColors = COLORS.filter((c) => state.bank[c] > 0);
    if (uniq.length === 1) {
      if (colors.length === 2) {
        if (state.bank[uniq[0]] < 4) return { ok: false, reason: '库存少于 4 枚，不能拿 2 枚同色' };
        return { ok: true, kind: 'pair', color: uniq[0] };
      }
      // 极端情况：只剩一种颜色有库存时，只能拿走剩下的
      if (colors.length === 1 && availableColors.length === 1 && availableColors[0] === uniq[0]) {
        return { ok: true, kind: 'single' };
      }
      return { ok: false, reason: '同色宝石必须一次拿 2 枚' };
    }
    if (uniq.length !== colors.length) {
      return { ok: false, reason: '不能同时拿同色和异色宝石' };
    }
    if (colors.length === 3 && colors.every((c) => state.bank[c] > 0)) {
      return { ok: true, kind: 'different' };
    }
    // 极端情况下库存不足 3 种颜色时，允许拿光所有可用颜色
    if (availableColors.length < 3 && colors.length === availableColors.length && colors.every((c) => state.bank[c] > 0)) {
      return { ok: true, kind: 'different' };
    }
    if (colors.length < 3) return { ok: false, reason: '请拿 3 种不同颜色的宝石' };
    return { ok: false, reason: '所选宝石库存不足' };
  }

  // ------------------------------------------------------------
  // 日志 / 事件
  // ------------------------------------------------------------
  function log(state, text, kind) {
    state.log.push({ text, kind: kind || 'info', t: Date.now() });
    if (state.log.length > 80) state.log.shift();
  }

  function emit(state, event) {
    state.eventSeq += 1;
    state.lastEvent = Object.assign({ seq: state.eventSeq }, event);
    if (event.type === 'buy') {
      log(
        state,
        state.players[event.player].name + '购得【' + event.cardName + '】' +
          (event.points ? '，+' + event.points + ' 分' : '，+' + GEM[event.bonus].name + '折扣'),
        'buy'
      );
    } else if (event.type === 'reserve') {
      log(
        state,
        state.players[event.player].name + '预订了【' + event.cardName + '】' + (event.gold ? '，+1 黄金' : ''),
        'reserve'
      );
    } else if (event.type === 'take') {
      const names = event.colors.map((c) => GEM[c].name).join('、');
      log(state, state.players[event.player].name + '拿取 ' + names, 'take');
    } else if (event.type === 'noble') {
      log(state, state.players[event.player].name + '获得贵族【' + event.nobleName + '】，+3 分', 'noble');
    } else if (event.type === 'discard') {
      log(state, state.players[event.player].name + '归还了多余的宝石', 'discard');
    }
  }

  // ------------------------------------------------------------
  // 行动
  // ------------------------------------------------------------
  function buyCard(state, playerId, cardId) {
    if (!state || state.phase === 'over') return fail('对局已结束');
    if (state.phase !== 'play') return fail('当前不能购买卡牌');
    if (state.current !== playerId) return fail('还没轮到你');

    const loc = locateCard(state, cardId);
    if (!loc) return fail('这张卡已经不在场上');
    if (loc.zone === 'reserved' && loc.player !== playerId) return fail('不能购买对手预订的卡牌');

    const player = state.players[playerId];
    const card = cardAt(state, loc);
    if (!card) return fail('这张卡已经不在场上');

    const aff = affordability(player, card);
    if (!aff.ok) return fail('宝石不足，还差 ' + (aff.gold - player.tokens.gold) + ' 枚');

    // 支付：优先使用彩色宝石，再用黄金补足
    for (const color of COLORS) {
      const d = aff.detail[color];
      player.tokens[color] -= d.pay;
      state.bank[color] += d.pay;
    }
    player.tokens.gold -= aff.gold;
    state.bank.gold += aff.gold;

    // 从场上 / 预订区移走，并补牌
    let fromReserved = false;
    if (loc.zone === 'market') {
      state.market[loc.level][loc.index] = drawFromDeck(state, loc.level);
    } else {
      player.reserved.splice(loc.index, 1);
      fromReserved = true;
    }

    player.cards.push(card);
    player.bonuses[card.bonus] += 1;
    player.points += card.points;

    emit(state, {
      type: 'buy',
      player: playerId,
      cardId: card.id,
      cardName: card.name,
      points: card.points,
      bonus: card.bonus,
      fromReserved,
    });

    afterAction(state);
    return { ok: true };
  }

  function reserveCard(state, playerId, cardId, options) {
    if (!state || state.phase === 'over') return fail('对局已结束');
    if (state.phase !== 'play') return fail('当前不能预订卡牌');
    if (state.current !== playerId) return fail('还没轮到你');

    const opts = options || {};
    const player = state.players[playerId];
    if (player.reserved.length >= 3) return fail('最多只能预订 3 张卡牌');

    let card = null;
    let blind = false;
    if (opts.blindLevel) {
      const level = Number(opts.blindLevel);
      if (!state.decks[level] || state.decks[level].length === 0) return fail('该等级牌堆已经空了');
      card = state.decks[level].pop();
      blind = true;
    } else {
      const loc = locateCard(state, cardId);
      if (!loc || loc.zone !== 'market') return fail('只能预订场上的卡牌');
      card = cardAt(state, loc);
      state.market[loc.level][loc.index] = drawFromDeck(state, loc.level);
    }
    if (!card) return fail('没有可预订的卡牌');

    player.reserved.push(card);
    let gotGold = false;
    if (state.bank.gold > 0) {
      state.bank.gold -= 1;
      player.tokens.gold += 1;
      gotGold = true;
    }

    emit(state, {
      type: 'reserve',
      player: playerId,
      cardId: card.id,
      cardName: blind ? LEVEL_NUMERALS[card.level] + ' 级盲抽卡' : card.name,
      gold: gotGold,
      blind,
    });

    afterAction(state);
    return { ok: true };
  }

  function takeTokens(state, playerId, colors) {
    if (!state || state.phase === 'over') return fail('对局已结束');
    if (state.phase !== 'play') return fail('当前不能拿取宝石');
    if (state.current !== playerId) return fail('还没轮到你');

    const check = validateTake(state, colors);
    if (!check.ok) return fail(check.reason);

    const player = state.players[playerId];
    for (const color of colors) {
      state.bank[color] -= 1;
      player.tokens[color] += 1;
    }

    emit(state, { type: 'take', player: playerId, colors: colors.slice(), kind: check.kind });
    afterAction(state);
    return { ok: true };
  }

  function chooseNoble(state, nobleId) {
    if (!state || state.phase !== 'noble') return fail('现在不需要选择贵族');
    if (!state.pending || !Array.isArray(state.pending.eligible)) return fail('没有可选择的贵族');
    if (!state.pending.eligible.includes(nobleId)) return fail('这位贵族不在可选范围内');

    const noble = state.nobles.find((n) => n.id === nobleId);
    if (!noble) return fail('贵族已经离开');

    awardNoble(state, state.players[state.current], noble);
    state.phase = 'play';
    state.pending = null;

    checkEndTrigger(state);
    if (state.phase === 'over') return { ok: true };
    beginTurnEnd(state);
    return { ok: true };
  }

  function discardToken(state, color) {
    if (!state || state.phase !== 'discard') return fail('现在不需要归还宝石');
    if (!ALL_GEMS.includes(color)) return fail('不存在的宝石');
    const player = state.players[state.current];
    if (!player.tokens[color]) return fail('没有这枚宝石');

    player.tokens[color] -= 1;
    state.bank[color] += 1;
    state.pending.returnCount -= 1;

    if (state.pending.returnCount <= 0) {
      state.phase = 'play';
      state.pending = null;
      emit(state, { type: 'discard', player: state.current });
      endTurn(state);
    }
    return { ok: true };
  }

  // ------------------------------------------------------------
  // 回合流程
  // ------------------------------------------------------------
  function afterAction(state) {
    if (state.phase === 'over' || state.phase === 'noble') return;
    const player = state.players[state.current];

    const eligible = eligibleNobles(state, player);
    if (eligible.length === 1) {
      awardNoble(state, player, eligible[0]);
    } else if (eligible.length > 1) {
      if (player.isAI) {
        awardNoble(state, player, eligible[0]);
      } else {
        state.phase = 'noble';
        state.pending = { eligible: eligible.map((n) => n.id) };
        return;
      }
    }

    checkEndTrigger(state);
    if (state.phase === 'over') return;
    beginTurnEnd(state);
  }

  function awardNoble(state, player, noble) {
    state.nobles = state.nobles.filter((n) => n.id !== noble.id);
    player.nobles.push(noble);
    player.points += noble.points;
    emit(state, {
      type: 'noble',
      player: state.current,
      nobleId: noble.id,
      nobleName: noble.name,
      points: noble.points,
    });
  }

  function checkEndTrigger(state) {
    if (state.endTriggered) return;
    const player = state.players[state.current];
    if (player.points < 15) return;

    state.endTriggered = true;
    const count = state.players.length;
    const offset = (state.current - state.firstPlayer + count) % count;
    // 包含触发者当前回合：本轮剩余玩家（按顺序）都还有一次行动
    state.finalTurnsLeft = count - offset;
    const immediate = state.finalTurnsLeft <= 1;
    log(
      state,
      player.name + '达到 15 分，' + (immediate ? '本轮结束。' : '最后一轮！'),
      'final'
    );
    emit(state, {
      type: 'final',
      player: state.current,
      immediate,
      turnsLeft: state.finalTurnsLeft,
    });
  }

  function beginTurnEnd(state) {
    const player = state.players[state.current];
    const over = totalTokens(player) - 10;
    if (over > 0) {
      if (player.isAI) {
        let guard = 0;
        while (totalTokens(player) > 10 && guard++ < 20) {
          autoDiscardOne(state, player);
        }
        endTurn(state);
      } else {
        state.phase = 'discard';
        state.pending = { returnCount: over };
      }
      return;
    }
    endTurn(state);
  }

  function endTurn(state) {
    if (state.phase === 'over') return;
    if (state.endTriggered) {
      state.finalTurnsLeft = Math.max(0, (state.finalTurnsLeft || 0) - 1);
      if (state.finalTurnsLeft <= 0) {
        finishGame(state);
        return;
      }
    }
    state.current = (state.current + 1) % state.players.length;
    state.turnCount += 1;
    state.phase = 'play';
    state.pending = null;
  }

  function finishGame(state) {
    state.phase = 'over';
    state.pending = null;
    state.finishedAt = Date.now();

    const ranked = state.players.map((player, index) => ({
      index,
      points: player.points,
      cards: player.cards.length,
    })).sort((a, b) => b.points - a.points || a.cards - b.cards || a.index - b.index);
    const top = ranked[0];
    const tied = ranked.filter((r) => r.points === top.points && r.cards === top.cards);
    const winner = tied.length === 1 ? top.index : -1;

    state.winner = winner;
    log(
      state,
      winner === -1
        ? '对局结束，' + (tied.length > 1 ? '最高分与卡牌数相同，平局。' : '平局。')
        : '对局结束，' + state.players[winner].name + '以 ' + state.players[winner].points + ' 分获胜！',
      'final'
    );
    emit(state, {
      type: 'gameover',
      winner,
      points: state.players.map((player) => player.points),
      cards: state.players.map((player) => player.cards.length),
    });
  }

  // ------------------------------------------------------------
  // AI
  // ------------------------------------------------------------
  function marketCards(state) {
    const list = [];
    for (const level of [1, 2, 3]) {
      for (const card of state.market[level]) {
        if (card) list.push(card);
      }
    }
    return list;
  }

  function buildNeedScores(state, player, includeReserved) {
    const need = { white: 0, blue: 0, green: 0, red: 0, black: 0 };
    const cards = marketCards(state);
    if (includeReserved) cards.push(...player.reserved);

    for (const card of cards) {
      const m = missingByColor(player, card);
      if (m.total <= 0) continue;
      let weight = card.points * 2.4 + (4 - card.level) * 1.2 + 2.2;
      if (card.level === 3) weight += 2.5;
      if (m.total > 4) weight *= 0.72;
      if (m.total <= 2) weight *= 1.25;
      for (const color of COLORS) {
        if (m.by[color] > 0) need[color] += weight * (m.by[color] / m.total);
      }
    }

    for (const noble of state.nobles) {
      const unmet = COLORS.filter((c) => player.bonuses[c] < noble.req[c]);
      if (unmet.length > 0 && unmet.length <= 2) {
        const near = unmet.reduce((s, c) => s + Math.min(1, player.bonuses[c] / noble.req[c]), 0);
        for (const c of unmet) need[c] += 4 + near * 4;
      }
    }

    return need;
  }

  function evaluateBuy(state, player, card, aff) {
    let score = card.points * 18;
    const owned = player.bonuses[card.bonus] || 0;
    score += Math.max(2.5, 10 - owned * 1.6);

    // 贵族进度
    for (const noble of state.nobles) {
      let before = 0;
      let after = 0;
      let total = 0;
      for (const c of COLORS) {
        const req = noble.req[c];
        total += req;
        before += Math.min(player.bonuses[c], req);
        after += Math.min(player.bonuses[c] + (c === card.bonus ? 1 : 0), req);
      }
      if (after === total) score += 46;
      else if (after > before) score += 5 + (after / Math.max(1, total)) * 9;
    }

    // 效率与黄金
    const spent = Math.max(0, aff.tokenCost + aff.gold);
    score -= aff.gold * 2.4;
    score -= spent * 0.32;

    // 抢走其他玩家想要的牌
    const opponents = state.players.filter((p) => p !== player);
    if (opponents.some((opponent) => affordability(opponent, card).ok)) {
      score += card.points * 1.8 + 2.5;
    }
    return score;
  }

  function evaluateReserve(state, player, card) {
    const aff = affordability(player, card);
    if (aff.ok) return -Infinity; // 能买就买
    const m = missingByColor(player, card);
    const opponents = state.players.filter((p) => p !== player);
    const opponentCanBuy = opponents.some((opponent) => affordability(opponent, card).ok);

    let score = card.points * 8.5;
    score += Math.max(0, 9 - (player.bonuses[card.bonus] || 0) * 1.4) * 0.55;
    score += card.level === 3 ? 5 : 0;
    score -= m.afterGold * 2.3;
    if (opponentCanBuy) score += 16 + card.points * 2;
    if (state.bank.gold > 0) score += 4;
    if (player.reserved.length > 0) score -= 6;
    if (card.points === 0) score -= 8;
    return score;
  }

  function evaluateTokenMoves(state, player) {
    const need = buildNeedScores(state, player, true);
    const opponents = state.players.filter((p) => p !== player);
    const oppNeed = {};
    for (const c of COLORS) oppNeed[c] = 0;
    for (const opponent of opponents) {
      const scores = buildNeedScores(state, opponent, false);
      for (const c of COLORS) oppNeed[c] += scores[c];
    }
    for (const c of COLORS) need[c] += (oppNeed[c] / Math.max(1, opponents.length)) * 0.14;

    const total = totalTokens(player);
    const basePenalty = total >= 9 ? (total - 8) * 4 : 0;
    const overflowPenalty = (n) => Math.max(0, total + n - 10) * 6;
    const moves = [];

    const available = COLORS.filter((c) => state.bank[c] > 0);
    if (available.length >= 3) {
      const picks = COLORS.slice()
        .filter((c) => state.bank[c] > 0)
        .sort((a, b) => need[b] - need[a])
        .slice(0, 3);
      const useful = picks.filter((c) => need[c] > 0).length;
      let s = 6 + picks.reduce((acc, c) => acc + need[c], 0) * 0.35 + useful * 1.5;
      s -= basePenalty + overflowPenalty(3);
      moves.push({ type: 'take', colors: picks, score: s });
    } else if (available.length > 0) {
      let s = 4 + available.reduce((acc, c) => acc + need[c], 0) * 0.35;
      s -= basePenalty + overflowPenalty(available.length);
      moves.push({ type: 'take', colors: available.slice(), score: s });
    }

    for (const color of COLORS) {
      if (state.bank[color] < 4) continue;
      let s = 4 + need[color] * 0.85;
      if (need[color] >= 3) s += 3;
      if (need[color] <= 0) s -= 6;
      s -= basePenalty * 1.2 + overflowPenalty(2);
      moves.push({ type: 'take', colors: [color, color], score: s });
    }

    moves.sort((a, b) => b.score - a.score);
    return moves;
  }

  function chooseAIAction(state, player) {
    const buyable = [];
    for (const card of marketCards(state)) {
      const aff = affordability(player, card);
      if (aff.ok) buyable.push({ card, aff, score: evaluateBuy(state, player, card, aff) });
    }
    for (const card of player.reserved) {
      const aff = affordability(player, card);
      if (aff.ok) buyable.push({ card, aff, score: evaluateBuy(state, player, card, aff) + 2 });
    }
    let bestBuy = null;
    if (buyable.length) {
      buyable.sort((a, b) => b.score - a.score || b.card.points - a.card.points);
      bestBuy = buyable[0];
    }

    let bestReserve = null;
    if (player.reserved.length < 3) {
      for (const card of marketCards(state)) {
        const s = evaluateReserve(state, player, card);
        if (!bestReserve || s > bestReserve.score) bestReserve = { type: 'reserve', cardId: card.id, score: s };
      }
    }

    const tokenMoves = evaluateTokenMoves(state, player);
    const bestToken = tokenMoves.length ? tokenMoves[0] : null;

    if (bestBuy) {
      // 已经拿满 / 快拿满时先买牌，否则会陷入互相拿宝石再弃掉的死循环
      if (totalTokens(player) >= 9) return { type: 'buy', cardId: bestBuy.card.id };
      // 早期买 0 分卡铺引擎，中后期把宝石留给高分卡
      const tempo = Math.max(0, 11 - player.cards.length) * 1.1;
      const buyScore = bestBuy.score + (bestBuy.card.points === 0 ? tempo : 5);
      const alt = Math.max(bestToken ? bestToken.score : -99, bestReserve ? bestReserve.score : -99);
      if (bestBuy.card.points >= 2 || buyScore >= alt) {
        return { type: 'buy', cardId: bestBuy.card.id };
      }
    }

    // 高分卡够不着时，预订它：既能拿黄金，也能防止对手抢走
    if (bestReserve && bestReserve.score > 20 && (!bestToken || bestReserve.score > bestToken.score + 4)) {
      return { type: 'reserve', cardId: bestReserve.cardId };
    }
    if (bestToken) return bestToken;
    if (bestReserve && bestReserve.score > 10) return { type: 'reserve', cardId: bestReserve.cardId };

    // 最后的兜底：盲抽预订，或者随便拿点宝石
    if (player.reserved.length < 3) {
      for (const level of [3, 2, 1]) {
        if (state.decks[level].length) return { type: 'reserveBlind', level };
      }
    }
    return null;
  }

  function autoDiscardOne(state, player) {
    const need = buildNeedScores(state, player, true);
    const owned = ALL_GEMS.filter((c) => player.tokens[c] > 0);
    if (!owned.length) return null;
    owned.sort((a, b) => {
      const sa = need[a] + (a === GOLD ? 2.5 : 0);
      const sb = need[b] + (b === GOLD ? 2.5 : 0);
      return sa - sb;
    });
    const color = owned[0];
    player.tokens[color] -= 1;
    state.bank[color] += 1;
    return color;
  }

  /**
   * 让当前 AI 执行一个完整回合。
   * 返回是否真的执行了行动。
   */
  function aiPlay(state) {
    if (!state || state.phase === 'over') return false;
    const player = state.players[state.current];
    if (!player || !player.isAI) return false;

    if (state.phase === 'noble') {
      if (!state.pending || !state.pending.eligible.length) return false;
      chooseNoble(state, state.pending.eligible[0]);
      return true;
    }
    if (state.phase === 'discard') {
      let guard = 0;
      while (state.phase === 'discard' && guard++ < 20) {
        const color = autoDiscardOne(state, player);
        if (!color) break;
        discardToken(state, color);
      }
      return true;
    }

    const action = chooseAIAction(state, player);
    if (!action) {
      // 理论上不会发生；保险起见直接结束回合，避免卡死
      log(state, player.name + '跳过了一个无法行动的回合。', 'system');
      endTurn(state);
      return false;
    }

    let result;
    if (action.type === 'buy') {
      result = buyCard(state, state.current, action.cardId);
    } else if (action.type === 'reserve') {
      result = reserveCard(state, state.current, action.cardId);
    } else if (action.type === 'reserveBlind') {
      result = reserveCard(state, state.current, null, { blindLevel: action.level });
    } else if (action.type === 'take') {
      result = takeTokens(state, state.current, action.colors);
    }

    if (!result || !result.ok) {
      // 回退方案：拿三种可用宝石；再不行就结束回合
      const colors = COLORS.filter((c) => state.bank[c] > 0).slice(0, 3);
      if (colors.length >= 2) {
        result = takeTokens(state, state.current, colors);
      }
      if (!result || !result.ok) {
        endTurn(state);
        return false;
      }
    }

    // AI 的多贵族选择 / 弃牌都已在流程内自动处理
    if (state.phase === 'noble' && state.players[state.current].isAI) {
      chooseNoble(state, state.pending.eligible[0]);
    }
    if (state.phase === 'discard' && state.players[state.current].isAI) {
      let guard = 0;
      while (state.phase === 'discard' && guard++ < 20) {
        const color = autoDiscardOne(state, state.players[state.current]);
        if (!color) break;
        discardToken(state, color);
      }
    }
    return true;
  }

  function drawFromDeck(state, level) {
    const deck = state.decks[level];
    if (!deck || !deck.length) return null;
    return deck.pop();
  }

  function fail(reason) {
    return { ok: false, reason };
  }

  // ------------------------------------------------------------
  // 存档
  // ------------------------------------------------------------
  function serialize(state) {
    return JSON.stringify(state);
  }

  function loadState(raw) {
    let data = raw;
    if (typeof raw === 'string') {
      try {
        data = JSON.parse(raw);
      } catch (e) {

      }
    }
    if (!data || data.v !== VERSION || !Array.isArray(data.players) || data.players.length !== 4) {

    if (!data.decks || !data.market || !data.bank || !Array.isArray(data.nobles)) return null;

    try {
      // 重建卡牌对象引用，避免 JSON 反序列化后同一张卡出现多个副本
      const cardMap = new Map();
      const collect = (card) => {
        if (card && card.id && !cardMap.has(card.id)) cardMap.set(card.id, card);

      for (const level of [1, 2, 3]) {
        (data.decks[level] || []).forEach(collect);
        (data.market[level] || []).forEach(collect);
      }
      for (const p of data.players) {
        (p.cards || []).forEach(collect);
        (p.reserved || []).forEach(collect);
      }

      for (const level of [1, 2, 3]) {
        data.decks[level] = (data.decks[level] || []).map((c) => (c ? cardMap.get(c.id) || c : null));
        data.market[level] = (data.market[level] || []).map((c) => (c ? cardMap.get(c.id) || c : null));
      }
      for (const p of data.players) {
        p.cards = (p.cards || []).map((c) => cardMap.get(c.id) || c);
        p.reserved = (p.reserved || []).map((c) => cardMap.get(c.id) || c);
      }

      const nobleMap = new Map();
      for (const n of data.nobles) nobleMap.set(n.id, n);
      for (const p of data.players) {
        for (const n of p.nobles || []) if (!nobleMap.has(n.id)) nobleMap.set(n.id, n);
      }
      data.nobles = data.nobles.map((n) => nobleMap.get(n.id) || n);
      for (const p of data.players) {
        p.nobles = (p.nobles || []).map((n) => nobleMap.get(n.id) || n);
      }

      if (!Array.isArray(data.log)) data.log = [];
      if (typeof data.eventSeq !== 'number') data.eventSeq = 0;
      data.lastEvent = null;
      return data;
    } catch (e) {
      return null;
    }
  }

  // ------------------------------------------------------------
  // 导出
  // ------------------------------------------------------------
  global.GemEngine = {
    VERSION,
    COLORS,
    GOLD,
    ALL_GEMS,
    GEM,
    LEVEL_NAMES,
    LEVEL_NUMERALS,
    CARD_PATTERNS,
    CARD_VARIANTS,
    buildCards,
    buildNobles,
    createGame,
    totalTokens,
    totalCards,
    locateCard,
    cardAt,
    affordability,
    missingByColor,
    eligibleNobles,
    validateTake,
    buyCard,
    reserveCard,
    takeTokens,
    chooseNoble,
    discardToken,
    aiPlay,

    loadState,

  function hash(value) {
